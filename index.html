<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-study-planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
<link rel="stylesheet" href="./src/style/main.css">
</head>
<body class="bg-[#FAF8FF] h-screen flex">
    <div class="bg-white w-[25%] h-screen">
        <div class="Header flex">
            <img src="" alt="Logo">
            <div class="flex flex-col">
                <h1>StudyPlanner</h1>
                <p>Student Workspace</p>
            </div>
        </div>

        <div class="Manu m-2 flex flex-col gap-2">
            <div class="flex gap-2 bg-[#2563EB] rounded-md p-2 items-center text-white font-medium">
                <ion-icon name="home-outline" size="small"></ion-icon>
                <h1>DashBoard</h1>
            </div>

            <div class="flex gap-2  rounded-md p-2 items-center text-black hover:bg-[#2563EB] hover:text-white cursor-pointer">
                <ion-icon name="checkbox-outline" size="small"></ion-icon>
                <h1>Tasks</h1>
            </div>

            <div class="flex gap-2  rounded-md p-2 items-center text-black hover:bg-[#2563EB] hover:text-white cursor-pointer">
                <ion-icon name="book-outline" size="small"></ion-icon>
                <h1>Subjects</h1>
            </div>

            <div class="flex gap-2  rounded-md p-2 items-center text-black hover:bg-[#2563EB] hover:text-white cursor-pointer">
                <ion-icon name="calendar-clear-outline" size="small"></ion-icon>
                <h1>Calendar</h1>
            </div>
            <div class="flex gap-2  rounded-md p-2 items-center text-black hover:bg-[#2563EB] hover:text-white cursor-pointer">
                <ion-icon name="analytics-outline" size="small"></ion-icon>
                <h1>Progress & Analytics</h1>
            </div>

            <div class="flex gap-2  rounded-md p-2 items-center text-black hover:bg-[#2563EB] hover:text-white cursor-pointer">
                <ion-icon name="settings-outline" size="small"></ion-icon>
                <h1>Settings</h1>
            </div>
        </div>


        <div class="fixed bottom-0 w-[18%] bg-[#F2F3FF] m-5 p-5 rounded-md">
            <div class="flex justify-between">
                <b>Storage</b>
                <p class="rounded-full text-[#0073A5] bg-[#DAE2FD] pl-2 pr-2"><ion-icon name="ellipse" class="text-[10px] text-[#0073A5]"></ion-icon> Ready</p>
            </div>
            <p class="text-[#A2A4AF] text-sm pt-1">LocalStorage (Offline Ready)</p>
        </div>
    </div>

    <div class="bg-white h-[10%] w-screen p-2 flex justify-between">
        <input placeholder="Search tasks, subjects... " class="bg-[#F2F3FF] p-3 rounded-md w-[40%] pl-10">

        <div class="flex gap-5 items-center">
        <div class="calendar flex bg-[#F2F3FF] text-black  rounded-full items-center pl-3 pr-3">
            <ion-icon name="calendar-clear-outline" size="small"></ion-icon>
             <span> Today, Oct 24</span>
        </div>


        <button class="p-3 bg-[#2563EB] text-white rounded-md"> <ion-icon name="add" class="text-white"></ion-icon> Add Task </button>

        <div class="Profile flex gap-2">
            <div class="flex flex-col">
                <p>Aman Bhagat</p>
                <p>Grade 12</p>
            </div>
            <img src="" alt="Profile">
        </div>
        </div>
    </div>
    <!-- <img src="./src/img/screen1.png"> -->
</body>
</html>
