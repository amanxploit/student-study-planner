<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Study Planner - Organize your academic life efficiently">
    <title>StudyPlanner - Student Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    
</head>
<body class="scrollbar-thin">
    <aside class="sidebar" role="navigation" aria-label="Main navigation">
        <div class="p-6 border-b border-[var(--color-border)]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[var(--color-primary)] flex items-center justify-center">
                    <ion-icon name="school-outline" class="text-white text-2xl"></ion-icon>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-[var(--color-text)]">StudyPlanner</h1>
                    <p class="text-xs text-[var(--color-text-muted)]">Student Workspace</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto scrollbar-thin" aria-label="Navigation menu">
            <button class="nav-item active" aria-current="page">
                <ion-icon name="home-outline"></ion-icon>
                <span>Dashboard</span>
            </button>
            <button class="nav-item">
                <ion-icon name="checkbox-outline"></ion-icon>
                <span>Tasks</span>
            </button>
            <button class="nav-item">
                <ion-icon name="book-outline"></ion-icon>
                <span>Subjects</span>
            </button>
            <button class="nav-item">
                <ion-icon name="calendar-outline"></ion-icon>
                <span>Calendar</span>
            </button>
            <button class="nav-item">
                <ion-icon name="analytics-outline"></ion-icon>
                <span>Progress & Analytics</span>
            </button>
            <button class="nav-item">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Settings</span>
            </button>
        </nav>

        <div class="p-4 border-t border-[var(--color-border)]">
            <div class="storage-card">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-semibold text-[var(--color-text)]">Storage</span>
                    <span class="status-badge ready">
                        <ion-icon name="checkmark-circle-outline" class="text-[12px]"></ion-icon>
                        Ready
                    </span>
                </div>
                <p class="text-xs text-[var(--color-text-muted)]">LocalStorage (Offline Ready)</p>
            </div>
        </div>
    </aside>

    <main class="main-content" role="main">
        <header class="top-bar">
            <div class="h-full flex flex-col flex-md-row items-center justify-between gap-3 md:gap-4 px-4 md:px-6">
                <div class="w-full md:flex-1 md:max-w-md">
                    <input
                        type="search"
                        class="search-input w-full"
                        placeholder="Search tasks, subjects..."
                        aria-label="Search tasks and subjects"
                        autocomplete="off"
                    >
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-end">
                    <button class="calendar-btn flex items-center gap-2 px-3 py-2 md:px-4 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-full text-sm font-medium text-[var(--color-text)] hover:bg-[var(--color-border)] transition-colors flex-1 md:flex-none justify-center" aria-label="Open calendar">
                        <ion-icon name="calendar-outline" class="text-[20px]"></ion-icon>
                        <span class="hidden md:inline">Today, Oct 24</span>
                    </button>

                    <button class="btn-primary px-3 md:px-4 flex-1 md:flex-none justify-center" aria-label="Add new task">
                        <ion-icon name="add" class="text-[20px]"></ion-icon>
                        <span class="hidden md:inline">Add Task</span>
                    </button>

                    <div class="profile-dropdown relative flex-1 md:flex-none justify-center" role="button" tabindex="0" aria-label="User menu" aria-expanded="false" aria-haspopup="true">
                        <div class="flex items-center gap-2 md:gap-3 cursor-pointer justify-center md:justify-end" id="profileTrigger">
                            <div class="hidden md:flex flex-col text-right">
                                <p class="text-sm font-medium text-[var(--color-text)]">Aman Bhagat</p>
                                <p class="text-xs text-[var(--color-text-muted)]">Grade 12</p>
                            </div>
                            <div class="avatar w-10 h-10 md:w-9 md:h-9 text-base md:text-base" aria-hidden="true">AB</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="content-area" id="appContent">
            <!-- Main content will be rendered here -->
            <div class="text-center py-12 text-[var(--color-text-muted)]">
                <ion-icon name="school-outline" class="text-6xl mx-auto mb-4 text-[var(--color-primary)]"></ion-icon>
                <h2 class="text-2xl font-semibold text-[var(--color-text)] mb-2">Welcome to StudyPlanner</h2>
                <p class="max-w-md mx-auto">Organize your studies, track progress, and achieve your academic goals.</p>
            </div>
        </div>
    </main>

    <script>
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }

        const userName = localStorage.getItem('userName') || 'User';
        document.querySelector('.profile-dropdown p').textContent = userName;

        // Mobile sidebar toggle
        const sidebar = document.querySelector('.sidebar');
        const menuBtn = document.createElement('button');
        menuBtn.className = 'fixed bottom-6 right-6 z-50 p-3 bg-[var(--color-primary)] text-white rounded-full shadow-lg md:hidden';
        menuBtn.innerHTML = '<ion-icon name="menu-outline" class="text-2xl"></ion-icon>';
        menuBtn.setAttribute('aria-label', 'Open navigation menu');
        menuBtn.setAttribute('aria-expanded', 'false');
        document.body.appendChild(menuBtn);

        menuBtn.addEventListener('click', () => {
            const isOpen = sidebar.classList.toggle('open');
            menuBtn.setAttribute('aria-expanded', isOpen);
            menuBtn.innerHTML = isOpen
                ? '<ion-icon name="close-outline" class="text-2xl"></ion-icon>'
                : '<ion-icon name="menu-outline" class="text-2xl"></ion-icon>';
        });

        // Close sidebar on link click (mobile)
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                if (window.innerWidth < 1024) {
                    sidebar.classList.remove('open');
                    menuBtn.setAttribute('aria-expanded', 'false');
                    menuBtn.innerHTML = '<ion-icon name="menu-outline" class="text-2xl"></ion-icon>';
                }
            });
        });

        // Profile dropdown
        const profileTrigger = document.getElementById('profileTrigger');
        let dropdown = null;

        profileTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        profileTrigger.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleDropdown();
            }
        });

        function toggleDropdown() {
            const isExpanded = profileTrigger.getAttribute('aria-expanded') === 'true';
            profileTrigger.setAttribute('aria-expanded', !isExpanded);

            if (!isExpanded) {
                dropdown = document.createElement('div');
                dropdown.className = 'absolute right-0 top-full mt-2 w-48 bg-white border border-[var(--color-border)] rounded-xl shadow-lg py-2 z-50';
                dropdown.innerHTML = `
                    <a href="#" class="block px-4 py-2 text-sm text-[var(--color-text)] hover:bg-[var(--color-bg)]">Profile</a>
                    <a href="#" class="block px-4 py-2 text-sm text-[var(--color-text)] hover:bg-[var(--color-bg)]">Settings</a>
                    <hr class="my-2 border-[var(--color-border)]">
                    <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-[var(--color-danger)] hover:bg-[var(--color-bg)]">Sign out</button>
                `;
                document.body.appendChild(dropdown);

                const rect = profileTrigger.getBoundingClientRect();
                dropdown.style.top = `${rect.bottom + window.scrollY + 8}px`;
                dropdown.style.left = `${rect.right - dropdown.offsetWidth}px`;

                dropdown.querySelector('#logoutBtn').addEventListener('click', () => {
                    localStorage.removeItem('userName');
                    localStorage.removeItem('isLoggedIn');
                    window.location.href = 'login.html';
                });

                document.addEventListener('click', closeOnOutsideClick);
                document.addEventListener('keydown', closeOnEscape);
            } else {
                closeDropdown();
            }
        }

        function closeDropdown() {
            if (dropdown) {
                dropdown.remove();
                dropdown = null;
                profileTrigger.setAttribute('aria-expanded', 'false');
                document.removeEventListener('click', closeOnOutsideClick);
                document.removeEventListener('keydown', closeOnEscape);
            }
        }

        function closeOnOutsideClick(e) {
            if (!profileTrigger.contains(e.target) && dropdown && !dropdown.contains(e.target)) {
                closeDropdown();
            }
        }

        function closeOnEscape(e) {
            if (e.key === 'Escape') {
                closeDropdown();
            }
        }

        // Search input enhancement
        const searchInput = document.querySelector('.search-input');
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.blur();
                searchInput.value = '';
            }
        });

        // Responsive handler
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                sidebar.classList.remove('open');
                menuBtn.setAttribute('aria-expanded', 'false');
                menuBtn.innerHTML = '<ion-icon name="menu-outline" class="text-2xl"></ion-icon>';
            }
        });
    </script>
</body>
</html>
